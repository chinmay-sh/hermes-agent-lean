# Hermes + Cloudflare Tunnel. Copy .env.example to .env and fill it in.
# No ports are published on the host; the dashboard is reachable only
# through the tunnel. In the Cloudflare dashboard, point the tunnel's
# public hostname at http://hermes:9119.
services:
  hermes:
    image: ${HERMES_IMAGE}
    container_name: hermes
    restart: unless-stopped
    command: [gateway, run]
    volumes:
      - ./data:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      # The lean image has no compiler toolchain, so runtime pip installs would fail anyway.
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      # Only used by the -kapso image variant; harmless on the plain tags.
      # See README.md#the--kapso-variant.
      KAPSO_API_KEY: ${KAPSO_API_KEY:-}
      KAPSO_WEBHOOK_SECRET: ${KAPSO_WEBHOOK_SECRET:-}
      KAPSO_PHONE_NUMBER_ID: ${KAPSO_PHONE_NUMBER_ID:-}
      KAPSO_HOME_CHANNEL: ${KAPSO_HOME_CHANNEL:-}
      KAPSO_ALLOWED_USERS: ${KAPSO_ALLOWED_USERS:-}
    expose:
      - "9119"
    networks: [hermes]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hermes-cloudflared
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [hermes]
    networks: [hermes]

networks:
  hermes:
